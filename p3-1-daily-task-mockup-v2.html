<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국어 - 首页 v2</title>
<style>
  :root {
    --bg-base: #FFF9FB;
    --bg-card: #FFFFFF;
    --bg-soft: #FFF0F3;
    --bg-input: #F5F0FF;
    --bg-accent: #FFF5FA;
    --text-primary: #2D1B2E;
    --text-secondary: #6B5B6E;
    --text-muted: #A89BAB;
    --pink-primary: #FF8FAB;
    --pink-pale: #FFD6E0;
    --purple-soft: #C9B8E8;
    --mint-soft: #68C9B2;
    --peach-soft: #FFB88C;
    --border-color: #F0E6EF;
    --color-danger: #EF4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'KaiTi', 'STKaiti', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    background: var(--bg-base); color: var(--text-primary);
    max-width: 480px; margin: 0 auto; min-height: 100vh;
    padding: 20px 16px 100px;
  }

  /* ── Header ── */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .mascot { font-size: 32px; }
  .greeting { font-size: 13px; color: var(--text-secondary); line-height: 1.3; }
  .greeting strong { color: var(--text-primary); font-size: 17px; display: block; }
  .streak-badge {
    display: flex; align-items: center; gap: 4px;
    background: linear-gradient(135deg, #FFF0F3, #FFF5FA);
    border: 1px solid var(--pink-pale); border-radius: 20px;
    padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--pink-primary);
  }

  /* ── Daily task row (compact, one line) ── */
  .daily-task-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-card); border: 1px solid var(--pink-pale);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;
    cursor: pointer; transition: box-shadow 0.15s;
  }
  .daily-task-row:hover { box-shadow: 0 2px 12px rgba(255,143,171,0.1); }
  .task-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--pink-pale); flex-shrink: 0;
  }
  .task-dot.done { background: var(--mint-soft); }
  .task-info { flex: 1; min-width: 0; }
  .task-info .tag { font-size: 11px; color: var(--pink-primary); font-weight: 600; }
  .task-info .desc { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-top: 1px; }
  .task-info .meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .task-btn {
    padding: 8px 18px; border-radius: 20px; border: none;
    background: var(--pink-primary); color: white;
    font-size: 13px; font-weight: 600; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
    transition: transform 0.1s;
  }
  .task-btn:active { transform: scale(0.95); }
  .task-btn.done { background: var(--mint-soft); }

  /* ── Stats row ── */
  .stats-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px; margin-bottom: 18px;
  }
  .stat-item { text-align: center; }
  .stat-item .val { font-size: 16px; font-weight: 700; color: var(--text-primary); }
  .stat-item .lbl { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
  .stat-item .xp-bar-outer {
    background: var(--bg-input); border-radius: 8px; height: 4px;
    margin: 4px 8px 0; overflow: hidden;
  }
  .stat-item .xp-bar-inner {
    background: linear-gradient(90deg, var(--pink-primary), var(--purple-soft));
    height: 100%; border-radius: 8px;
  }

  /* ── Divider ── */
  .section-hdr {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.03em;
    margin-bottom: 10px;
  }

  /* ── Continue learning ── */
  .continue-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 14px; padding: 14px; margin-bottom: 8px;
    cursor: pointer; transition: border-color 0.15s;
  }
  .continue-card:hover { border-color: var(--pink-pale); }
  .continue-card .c-emoji { font-size: 26px; width: 40px; text-align: center; flex-shrink: 0; }
  .continue-card .c-info { flex: 1; min-width: 0; }
  .continue-card .c-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .continue-card .c-sub  { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
  .continue-card .c-arrow { color: var(--text-muted); font-size: 16px; flex-shrink: 0; }
  .continue-card .c-badge {
    font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 10px;
    flex-shrink: 0;
  }
  .c-badge.warn  { background: #FFF3E0; color: var(--peach-soft); }
  .c-badge.info  { background: #F0F8FF; color: #68A0C9; }
  .c-badge.go    { background: #F0FFF8; color: var(--mint-soft); }

  /* ── Feature tags ── */
  .feature-tags {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .feature-tag {
    display: flex; align-items: center; gap: 5px;
    padding: 8px 14px; border-radius: 20px;
    background: var(--bg-card); border: 1px solid var(--border-color);
    font-size: 12px; font-weight: 500; color: var(--text-secondary);
    cursor: pointer; transition: border-color 0.15s;
  }
  .feature-tag:hover { border-color: var(--pink-pale); color: var(--text-primary); }
  .feature-tag .ft-emoji { font-size: 14px; }

  .divider { height: 1px; background: var(--border-color); margin: 18px 0; }

  /* ── Bottom nav ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-card); border-top: 1px solid var(--border-color);
    display: flex; justify-content: space-around; padding: 8px 0 20px;
    max-width: 480px; margin: 0 auto;
  }
  .bottom-nav a {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    text-decoration: none; font-size: 11px; color: var(--text-muted);
  }
  .bottom-nav a.active { color: var(--pink-primary); }
  .bottom-nav a .ni { font-size: 20px; }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="header">
  <div class="header-left">
    <div class="mascot">🐰</div>
    <div class="greeting">
      <strong>小明，早上好</strong>
      保持节奏，你已经连续7天了
    </div>
  </div>
  <div class="streak-badge">🔥 7天</div>
</div>

<!-- ═══ Daily task: just one row ═══ -->
<div class="daily-task-row" onclick="this.classList.toggle('done-state')">
  <div class="task-dot" id="taskDot"></div>
  <div class="task-info">
    <span class="tag">📌 今日任务</span>
    <div class="desc">学 5 个餐厅用语</div>
    <div class="meta">约8分钟 · +25 XP</div>
  </div>
  <button class="task-btn" id="taskBtn" onclick="event.stopPropagation(); toggleTask();">开始</button>
</div>

<!-- ═══ Stats bar ═══ -->
<div class="stats-row">
  <div class="stat-item">
    <div class="val">42</div>
    <div class="lbl">已学单词</div>
  </div>
  <div class="stat-item">
    <div class="val">Lv.6</div>
    <div class="lbl">等级</div>
    <div class="xp-bar-outer"><div class="xp-bar-inner" style="width:62%"></div></div>
  </div>
  <div class="stat-item">
    <div class="val">18</div>
    <div class="lbl">今日分钟</div>
  </div>
  <div class="stat-item">
    <div class="val">310</div>
    <div class="lbl">/ 500 XP</div>
  </div>
</div>

<div class="divider"></div>

<!-- ═══ Continue learning ═══ -->
<div class="section-hdr">📍 继续学习</div>

<div class="continue-card">
  <div class="c-emoji">🔄</div>
  <div class="c-info">
    <div class="c-title">SRS 间隔复习</div>
    <div class="c-sub">8个单词记忆健康度下降</div>
  </div>
  <span class="c-badge warn">待复习</span>
  <span class="c-arrow">→</span>
</div>

<div class="continue-card">
  <div class="c-emoji">📖</div>
  <div class="c-info">
    <div class="c-title">继续绘本 · 토리의 편의점</div>
    <div class="c-sub">看到第3页 · 还剩4页</div>
  </div>
  <span class="c-badge go">初级</span>
  <span class="c-arrow">→</span>
</div>

<div class="continue-card">
  <div class="c-emoji">🎬</div>
  <div class="c-info">
    <div class="c-title">继续跟读 · Run BTS</div>
    <div class="c-sub">上次练习到第 12 句</div>
  </div>
  <span class="c-badge info">进行中</span>
  <span class="c-arrow">→</span>
</div>

<div class="divider"></div>

<!-- ═══ Feature tags ═══ -->
<div class="section-hdr">🧩 功能入口</div>
<div class="feature-tags">
  <span class="feature-tag"><span class="ft-emoji">🎧</span>听写</span>
  <span class="feature-tag"><span class="ft-emoji">📝</span>写作</span>
  <span class="feature-tag"><span class="ft-emoji">📋</span>TOPIK</span>
  <span class="feature-tag"><span class="ft-emoji">🇰🇷</span>文化</span>
  <span class="feature-tag"><span class="ft-emoji">🎵</span>KPOP</span>
  <span class="feature-tag"><span class="ft-emoji">💬</span>AI对话</span>
  <span class="feature-tag"><span class="ft-emoji">👥</span>搭子</span>
  <span class="feature-tag"><span class="ft-emoji">📊</span>统计</span>
</div>

<!-- ═══ Bottom nav ═══ -->
<div class="bottom-nav">
  <a href="#" class="active"><span class="ni">🏠</span>首页</a>
  <a href="#"><span class="ni">📖</span>学习</a>
  <a href="#"><span class="ni">🔄</span>复习</a>
  <a href="#"><span class="ni">📋</span>词汇</a>
  <a href="#"><span class="ni">⋯</span>更多</a>
</div>

<script>
  // Demo toggle for the task button
  let taskDone = false;
  function toggleTask() {
    taskDone = !taskDone;
    const dot = document.getElementById('taskDot');
    const btn = document.getElementById('taskBtn');
    if (taskDone) {
      dot.classList.add('done');
      btn.classList.add('done');
      btn.textContent = '✓ 完成';
    } else {
      dot.classList.remove('done');
      btn.classList.remove('done');
      btn.textContent = '开始';
    }
  }
</script>

</body>
</html>
