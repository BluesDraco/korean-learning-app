<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>离线 - 韩语学习</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'KaiTi', 'STKaiti', 'Noto Sans SC', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .card {
      text-align: center; max-width: 360px; width: 100%;
    }
    .emoji { font-size: 64px; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #FFD6E0; }
    p { font-size: 0.875rem; color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .hint { font-size: 0.75rem; color: #64748b; }
    .btn {
      display: inline-block; padding: 0.75rem 2rem;
      background: #FFD6E0; color: #0f172a; border-radius: 999px;
      text-decoration: none; font-weight: 600; font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🐰</div>
    <h1>한국어 - 韩语学习</h1>
    <p>你当前处于离线状态。<br />请连接网络后重试。</p>
    <a href="/" class="btn">重试</a>
    <p class="hint">已缓存的页面和资源仍可访问</p>
  </div>
</body>
</html>
