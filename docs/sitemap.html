<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tori Korean — 项目网站地图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f0f13;
    color: #e8e0dc;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── Top bar ── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 52px;
    background: rgba(20,18,24,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
  }
  #topbar h1 {
    font-size: 15px; font-weight: 700; color: #f0799b; white-space: nowrap;
    letter-spacing: 0.3px;
  }
  #search-wrap {
    flex: 1; max-width: 320px;
    position: relative;
  }
  #search {
    width: 100%; height: 32px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    color: #e8e0dc;
    font-size: 13px;
    padding: 0 14px 0 34px;
    outline: none;
    transition: border-color 0.2s;
  }
  #search:focus { border-color: rgba(240,121,155,0.5); }
  #search-wrap::before {
    content: "🔍";
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    font-size: 13px; pointer-events: none;
  }
  #search::placeholder { color: rgba(232,224,220,0.35); }
  #hint {
    font-size: 11px; color: rgba(232,224,220,0.3);
    white-space: nowrap;
  }

  /* ── Canvas ── */
  #canvas-wrap {
    position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  #svg-canvas {
    width: 100%; height: 100%;
    cursor: grab;
  }
  #svg-canvas:active { cursor: grabbing; }

  /* ── Node styles ── */
  .node-root circle { filter: drop-shadow(0 0 18px rgba(240,121,155,0.5)); }
  .node-module circle { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
  .node-page circle {
    transition: r 0.15s ease, filter 0.15s ease;
    cursor: pointer;
  }
  .node-page:hover circle { filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
  .node-module { cursor: pointer; }

  .node-label {
    font-size: 12px; fill: #fff; font-weight: 600;
    text-anchor: middle; dominant-baseline: central;
    pointer-events: none;
  }
  .node-label-root { font-size: 13px; font-weight: 800; }
  .node-label-module { font-size: 12px; font-weight: 700; }
  .node-label-page { font-size: 10px; font-weight: 600; }

  .link { fill: none; stroke-width: 1.5; opacity: 0.4; transition: opacity 0.2s; }

  .dimmed { opacity: 0.12 !important; }
  .highlighted circle { filter: drop-shadow(0 0 14px rgba(255,255,255,0.6)) !important; }

  /* ── Detail panel ── */
  #detail-panel {
    position: fixed; top: 52px; right: 0; bottom: 0;
    width: 340px;
    background: rgba(22,20,28,0.97);
    backdrop-filter: blur(20px);
    border-left: 1px solid rgba(255,255,255,0.08);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    z-index: 200;
    overflow-y: auto;
    padding: 24px 20px 32px;
  }
  #detail-panel.open { transform: translateX(0); }

  #detail-close {
    position: absolute; top: 16px; right: 16px;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none; color: #e8e0dc; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  #detail-close:hover { background: rgba(255,255,255,0.16); }

  #detail-title {
    font-size: 18px; font-weight: 800; color: #fff;
    margin-bottom: 6px; padding-right: 36px;
    line-height: 1.3;
  }
  #detail-module-tag {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    padding: 2px 10px; border-radius: 999px;
    margin-bottom: 20px;
  }

  .detail-section {
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 14px 14px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .detail-section-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: rgba(232,224,220,0.4);
    margin-bottom: 8px;
  }
  .detail-section-icon {
    font-size: 14px; margin-right: 6px;
  }
  .detail-section code {
    display: block;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 11.5px; color: #aee3d8;
    background: rgba(0,0,0,0.3);
    border-radius: 6px; padding: 8px 10px;
    margin-top: 6px; line-height: 1.6;
    word-break: break-all;
  }
  .detail-debug {
    font-size: 12px; color: #fbbf72; line-height: 1.7;
    margin-top: 6px;
  }
  .detail-debug-item {
    display: flex; gap: 6px; margin-bottom: 4px;
  }
  .detail-debug-item::before {
    content: "→"; color: rgba(251,191,114,0.5); flex-shrink: 0;
  }

  /* ── Legend ── */
  #legend {
    position: fixed; bottom: 16px; left: 16px; z-index: 100;
    background: rgba(22,20,28,0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: rgba(232,224,220,0.6);
  }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }

  /* ── Zoom controls ── */
  #zoom-controls {
    position: fixed; bottom: 16px; right: 16px; z-index: 100;
    display: flex; flex-direction: column; gap: 4px;
  }
  .zoom-btn {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(22,20,28,0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    color: #e8e0dc; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .zoom-btn:hover { background: rgba(240,121,155,0.2); }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">

<!-- Canvas -->

<!-- Zoom controls -->

            debug: [
              '登录失败 → src/app/api/auth/login/route.ts',
              '登录状态丢失 → AuthProvider.tsx 的 token 存储',
              '注册不成功 → src/app/api/auth/ 接口和数据库',
            ]
          }
        },
        {
          id: 'settings', label: '设置', type: 'page',
          detail: {
            pageFile: 'src/app/settings/page.tsx',
            dataSource: 'localStorage（本地偏好）',
            component: '页面自包含',
            debug: [
              '主题不生效 → settings/page.tsx 的主题写入',
              '语速设置无效 → src/lib/tts.ts 的 rate 参数',
              '设置重置 → localStorage 被清除',
            ]
          }
        },
      ]
    },
  ]
};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let expandedModules = new Set();
let selectedNode = null;
let transform = { x: 0, y: 0, scale: 1 };
let dragging = false;
let dragStart = { x: 0, y: 0, tx: 0, ty: 0 };
let allPageNodes = []; // flat list for search

// ═══════════════════════════════════════════════════════
// LAYOUT MATH
// ═══════════════════════════════════════════════════════
function polar(angle, radius) {
  return { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
}

function computeLayout() {
  const CX = window.innerWidth / 2;
  const CY = (window.innerHeight - 52) / 2;
  const MODULE_R = 230;
  const PAGE_R = 420;

  const modules = DATA.children;
  const positions = { root: { x: CX, y: CY, r: 58 } };

  modules.forEach((mod, mi) => {
    const angle = (mi / modules.length) * Math.PI * 2 - Math.PI / 2;
    const pos = polar(angle, MODULE_R);
    positions[mod.id] = {
      x: CX + pos.x, y: CY + pos.y, r: 44,
      angle, parentId: 'root'
    };

    if (expandedModules.has(mod.id) && mod.children) {
      const children = mod.children;
      const spread = Math.min(Math.PI * 0.7, children.length * 0.28);
      children.forEach((page, pi) => {
        let childAngle;
        if (children.length === 1) {
          childAngle = angle;
        } else {
          childAngle = angle - spread / 2 + (pi / (children.length - 1)) * spread;
        }
        const ppos = polar(childAngle, PAGE_R);
        positions[page.id] = {
          x: CX + ppos.x, y: CY + ppos.y, r: 30,
          angle: childAngle, parentId: mod.id
        };
      });
    }
  });

  return positions;
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
const SVG_NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs = {}) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function renderMap() {
  const positions = computeLayout();
  const linksLayer = document.getElementById('links-layer');
  const nodesLayer = document.getElementById('nodes-layer');
  linksLayer.innerHTML = '';
  nodesLayer.innerHTML = '';
  allPageNodes = [];

  const g = el('g');
  g.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);

  const gLinks = el('g');
  const gNodes = el('g');
  g.appendChild(gLinks);
  g.appendChild(gNodes);

  // Draw links
  function drawLink(x1, y1, x2, y2, color) {
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    const path = el('path', {
      d: `M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`,
      stroke: color, 'stroke-width': '2', fill: 'none', opacity: '0.35',
      class: 'link'
    });
    gLinks.appendChild(path);
  }

  // Draw nodes
  function drawNode(node, pos, type, color, moduleId) {
    const group = el('g', { transform: `translate(${pos.x},${pos.y})`, class: `node-${type}`, id: `node-${node.id}` });

    const circle = el('circle', {
      r: pos.r,
      fill: color,
      stroke: 'rgba(255,255,255,0.15)',
      'stroke-width': '1.5'
    });
    group.appendChild(circle);

    // Text lines
    const lines = node.label.split('\n');
    if (lines.length === 1) {
      const t = el('text', { class: `node-label node-label-${type}` });
      t.textContent = node.label;
      group.appendChild(t);
    } else {
      lines.forEach((line, i) => {
        const t = el('text', {
          class: `node-label node-label-${type}`,
          y: ((i - (lines.length - 1) / 2) * 14) + ''
        });
        t.textContent = line;
        group.appendChild(t);
      });
    }

    // Expand indicator for modules
    if (type === 'module') {
      const expanded = expandedModules.has(node.id);
      const indicator = el('text', {
        y: pos.r + 14,
        'text-anchor': 'middle',
        'font-size': '10',
        fill: 'rgba(255,255,255,0.4)'
      });
      indicator.textContent = expanded ? '▲ 收起' : '▼ 展开';
      group.appendChild(indicator);
    }

    if (type === 'module') {
      group.style.cursor = 'pointer';
      group.addEventListener('click', (e) => {
        e.stopPropagation();
        if (expandedModules.has(node.id)) {
          expandedModules.delete(node.id);
        } else {
          expandedModules.add(node.id);
        }
        renderMap();
      });
    } else if (type === 'page') {
      group.style.cursor = 'pointer';
      group.addEventListener('click', (e) => {
        e.stopPropagation();
        showDetail(node, color);
      });
      allPageNodes.push({ node, group, color, moduleId });
    }

    gNodes.appendChild(group);
    return group;
  }

  // Root
  const rootPos = positions['root'];
  drawNode(DATA, rootPos, 'root', '#f0799b', null);

  // Modules + pages
  DATA.children.forEach(mod => {
    const modPos = positions[mod.id];
    if (!modPos) return;

    drawLink(rootPos.x, rootPos.y, modPos.x, modPos.y, mod.color);
    drawNode(mod, modPos, 'module', mod.color, null);

    if (expandedModules.has(mod.id) && mod.children) {
      mod.children.forEach(page => {
        const pagePos = positions[page.id];
        if (!pagePos) return;
        drawLink(modPos.x, modPos.y, pagePos.x, pagePos.y, mod.color);
        drawNode(page, pagePos, 'page', mod.color + 'cc', mod.id);
      });
    }
  });

  linksLayer.appendChild(g.children[0]);
  nodesLayer.appendChild(g.children[0]);

  // Rebuild with proper transform
  linksLayer.innerHTML = '';
  nodesLayer.innerHTML = '';

  const mainG = el('g', { transform: `translate(${transform.x},${transform.y}) scale(${transform.scale})` });
  mainG.appendChild(gLinks);
  mainG.appendChild(gNodes);
  linksLayer.parentNode.insertBefore(mainG, linksLayer);
  linksLayer.remove();
  nodesLayer.remove();

  // Re-assign layers
  mainG.id = 'main-g';
}

function fullRender() {
  const existing = document.getElementById('main-g');
  if (existing) existing.remove();

  const positions = computeLayout();
  allPageNodes = [];

  const mainG = el('g', { id: 'main-g', transform: `translate(${transform.x},${transform.y}) scale(${transform.scale})` });
  const gLinks = el('g');
  const gNodes = el('g');
  mainG.appendChild(gLinks);
  mainG.appendChild(gNodes);

  const svg = document.getElementById('svg-canvas');
  svg.appendChild(mainG);

  function drawLink(x1, y1, x2, y2, color) {
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    const path = el('path', {
      d: `M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`,
      stroke: color, 'stroke-width': '1.8', fill: 'none', opacity: '0.35',
      class: 'link'
    });
    gLinks.appendChild(path);
  }

  function drawNode(node, pos, type, color) {
    const group = el('g', { transform: `translate(${pos.x},${pos.y})`, class: `node-${type}`, id: `node-${node.id}` });

    const circle = el('circle', {
      r: pos.r,
      fill: color,
      stroke: 'rgba(255,255,255,0.18)',
      'stroke-width': '1.5'
    });
    group.appendChild(circle);

    const lines = node.label.split('\n');
    const lineH = 14;
    lines.forEach((line, i) => {
      const t = el('text', {
        class: `node-label node-label-${type}`,
        y: ((i - (lines.length - 1) / 2) * lineH) + ''
      });
      t.textContent = line;
      group.appendChild(t);
    });

    if (type === 'module') {
      const expanded = expandedModules.has(node.id);
      const ind = el('text', { y: pos.r + 13, 'text-anchor': 'middle', 'font-size': '9', fill: 'rgba(255,255,255,0.45)' });
      ind.textContent = expanded ? '▲ 收起' : '▼ 展开';
      group.appendChild(ind);

      group.style.cursor = 'pointer';
      group.addEventListener('click', ev => {
        ev.stopPropagation();
        if (expandedModules.has(node.id)) expandedModules.delete(node.id);
        else expandedModules.add(node.id);
        fullRender();
        applySearch(document.getElementById('search').value);
      });
    } else if (type === 'page') {
      group.style.cursor = 'pointer';
      group.addEventListener('click', ev => {
        ev.stopPropagation();
        showDetail(node, color);
      });
      allPageNodes.push({ node, group, color });
    }

    gNodes.appendChild(group);
  }

  const rootPos = positions['root'];
  drawNode(DATA, rootPos, 'root', '#f0799b');

  DATA.children.forEach(mod => {
    const modPos = positions[mod.id];
    if (!modPos) return;
    drawLink(rootPos.x, rootPos.y, modPos.x, modPos.y, mod.color);
    drawNode(mod, modPos, 'module', mod.color);

    if (expandedModules.has(mod.id) && mod.children) {
      mod.children.forEach(page => {
        const pagePos = positions[page.id];
        if (!pagePos) return;
        drawLink(modPos.x, modPos.y, pagePos.x, pagePos.y, mod.color);
        drawNode(page, pagePos, 'page', mod.color + 'bb');
      });
    }
  });
}

// ═══════════════════════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════════════════════
function showDetail(node, color) {
  selectedNode = node.id;
  const d = node.detail;
  const panel = document.getElementById('detail-panel');

  document.getElementById('detail-title').textContent = node.label.replace('\n', ' ');

  const tag = document.getElementById('detail-module-tag');
  tag.textContent = node.label.replace('\n', ' ');
  tag.style.background = color + '33';
  tag.style.color = color;
  tag.style.border = `1px solid ${color}44`;

  const body = document.getElementById('detail-body');
  body.innerHTML = `
    <div class="detail-section">
      <div class="detail-section-label"><span class="detail-section-icon">📄</span>页面文件</div>
      <code>${d.pageFile}</code>
    </div>
    <div class="detail-section">
      <div class="detail-section-label"><span class="detail-section-icon">🗄️</span>数据来源</div>
      <code>${d.dataSource}</code>
    </div>
    <div class="detail-section">
      <div class="detail-section-label"><span class="detail-section-icon">🔧</span>关键组件</div>
      <code>${d.component}</code>
    </div>
    <div class="detail-section" style="border-color:rgba(251,191,114,0.2)">
      <div class="detail-section-label" style="color:rgba(251,191,114,0.6)"><span class="detail-section-icon">⚠️</span>出问题找这里</div>
      <div class="detail-debug">
        ${d.debug.map(item => `<div class="detail-debug-item">${item}</div>`).join('')}
      </div>
    </div>
  `;

  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedNode = null;
}

// ═══════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════
function applySearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    allPageNodes.forEach(({ group }) => {
      group.style.opacity = '';
    });
    return;
  }

  // Auto-expand all modules for search
  DATA.children.forEach(mod => expandedModules.add(mod.id));
  fullRender();

  allPageNodes.forEach(({ node, group }) => {
    const text = (node.label + JSON.stringify(node.detail || '')).toLowerCase();
    const matches = text.includes(q);
    group.style.opacity = matches ? '1' : '0.1';
    if (matches) {
      group.querySelector('circle').style.filter = 'drop-shadow(0 0 14px rgba(255,255,255,0.7))';
    }
  });
}

document.getElementById('search').addEventListener('input', e => {
  applySearch(e.target.value);
});

// ═══════════════════════════════════════════════════════
// PAN & ZOOM
// ═══════════════════════════════════════════════════════
const svg = document.getElementById('svg-canvas');

svg.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY, tx: transform.x, ty: transform.y };
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  transform.x = dragStart.tx + (e.clientX - dragStart.x);
  transform.y = dragStart.ty + (e.clientY - dragStart.y);
  const g = document.getElementById('main-g');
  if (g) g.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
});

window.addEventListener('mouseup', () => { dragging = false; });

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  const newScale = Math.max(0.3, Math.min(2.5, transform.scale + delta));

  // Zoom toward mouse
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  transform.x = mx - (mx - transform.x) * (newScale / transform.scale);
  transform.y = my - (my - transform.y) * (newScale / transform.scale);
  transform.scale = newScale;

  const g = document.getElementById('main-g');
  if (g) g.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
}, { passive: false });

function zoomBy(delta) {
  transform.scale = Math.max(0.3, Math.min(2.5, transform.scale + delta));
  const g = document.getElementById('main-g');
  if (g) g.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
}

function resetView() {
  transform = { x: 0, y: 0, scale: 1 };
  fullRender();
}

// Click background closes detail
svg.addEventListener('click', () => closeDetail());

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
window.addEventListener('load', () => {
  fullRender();
});

window.addEventListener('resize', () => {
  fullRender();
  applySearch(document.getElementById('search').value);
});
</script>
